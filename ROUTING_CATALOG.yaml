{
  "schema_version": "1.0.0",
  "format": "JSON-compatible YAML 1.2; parse with Python standard-library json",
  "boundary": "只拥有 scene/applicability、reading trigger、canonical-home 与 projection/compatibility metadata；不拥有 authority、scope/acceptance、private topology、live project facts 或 protocol mechanics。",
  "navigation": {
    "entry": "执行/恢复/接管的第一份 normative rules 是 current governance repo 的 AGENTS.md；BOOT-1 可先做纯寻址。",
    "chain": [
      "00",
      "10",
      "20",
      "30",
      "40",
      "50",
      "90"
    ],
    "layers": {
      "00": "Kernel",
      "10": "Bootstrap",
      "20": "Roles",
      "30": "Protocols",
      "40": "Guides",
      "50": "Templates",
      "90": "History"
    },
    "results": {
      "NEXT": "角色/场景命中，targeted 读取必要 home 后继续。",
      "SKIP": "没有适用内容，不读该层正文。",
      "STOP_READY": "最小充分 context 与 current Bootstrap/execution gates 满足，即退出阅读链。",
      "STOP_BLOCKED": "真实 authority/access/currentness/security/dependency gate；报告精确缺口。"
    },
    "notes": [
      "链可短路，不是 mandatory full-read。没有 Human 新 prompt 本身不阻塞下一跳。",
      "在 L0 后按匹配场景选择 home；roles 中 Architect 包括 Project/Global Architect。普通 delegated executor 读取 exact Work/Dispatch、target-local rules 与 owns 范围；这些 owner-local 内容不进入本目录。",
      "同一文件命中多个场景只读取所需章节一次。只有生成对应 artifact 时才读取 templates；history 默认跳过。",
      "投影可直接用于选路；不要求再通读 catalog 或其它投影。新文档默认 L2/L3，提升 L0 必须遵守 AGENTS.md Kernel residency test。",
      "下层缺失/陈旧/冲突时保留 L0 判断：可选输入可跳过，必需输入无法替代则 STOP_BLOCKED；不能反向修改 authority/truth/scope。",
      "项目类型不会自动触发 Workspace Bootstrap、Human collaboration、全仓扫描、全量 Constitution、history 或任何外部项目。security/permission 与 cross-repo contract 仅按当前真实依赖读取 owner-local current source。"
    ]
  },
  "projections": {
    "human": "START_HERE.md",
    "reading": "READING_MAP.md",
    "compatibility": "NAMESPACE.md",
    "index": "docs/ROUTING_INDEX.md"
  },
  "entries": [
    {
      "id": "kernel",
      "layer": "00",
      "reading_level": "L0",
      "roles": [
        "all"
      ],
      "when": "execution / recovery / takeover 的第一份 normative rules",
      "home": "AGENTS.md",
      "section": "",
      "templates": [],
      "public": true
    },
    {
      "id": "language",
      "layer": "00",
      "reading_level": "L2",
      "roles": [
        "all"
      ],
      "when": "Human-facing language / override 存在歧义",
      "home": "00_KERNEL/LANGUAGE_POLICY.md",
      "section": "",
      "templates": [],
      "public": false
    },
    {
      "id": "bootstrap",
      "layer": "10",
      "reading_level": "L2",
      "roles": [
        "all"
      ],
      "when": "startup / recovery / access / live-state gate",
      "home": "10_BOOT/BOOTSTRAP_CHECK_PROTOCOL.md",
      "section": "",
      "templates": [
        "50_TEMPLATES/bootstrap_check_request.md",
        "50_TEMPLATES/capability_self_check.md"
      ],
      "public": true
    },
    {
      "id": "local-engineering-gate",
      "layer": "10",
      "reading_level": "L2",
      "roles": [
        "all"
      ],
      "when": "本地 / 本地+设备或明确依赖 local toolchain 的 execution preflight",
