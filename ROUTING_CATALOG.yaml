      "section": "",
      "templates": [],
      "public": true
    },
    {
      "id": "workspace",
      "layer": "10",
      "reading_level": "L2",
      "roles": [
        "Global Architect",
        "Human"
      ],
      "when": "仅 workspace 初始化 / role registration；普通项目执行不触发",
      "home": "10_BOOT/WORKSPACE_BOOTSTRAP_PROTOCOL.md",
      "section": "",
      "templates": [
        "50_TEMPLATES/HUMAN_WORKSPACE_BOOTSTRAP.md"
      ],
      "public": true
    },
    {
      "id": "roles",
      "layer": "20",
      "reading_level": "L2",
      "roles": [
        "all"
      ],
      "when": "current role / authority boundary 尚不明确",
