      "section": "§2",
      "templates": [],
      "public": false
    },
    {
      "id": "execution",
      "layer": "30",
      "reading_level": "L2",
      "roles": [
        "all"
      ],
      "when": "mutation / workspace hygiene、DIRECT/DELEGATE、dispatch / review / repair / continuation / completion / Maintenance Lane",
