      "templates": [
        "50_TEMPLATES/DISPATCH_PAIR.md"
      ],
      "public": true
    },
    {
      "id": "recovery",
      "layer": "30",
      "reading_level": "L2",
      "roles": [
        "all"
      ],
      "when": "planned transfer / crash takeover / old context unavailable / hot or warm resume；context modes / independence / delegation",
