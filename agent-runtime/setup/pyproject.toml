[project]
name = "agent-runtime-setup"
version = "0.1.0"
description = "Windows WSLC first-run setup engine and Textual wizard"
requires-python = ">=3.14,<3.15"
dependencies = ["textual==8.2.8", "PyYAML==6.0.3", "cryptography==46.0.3"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
