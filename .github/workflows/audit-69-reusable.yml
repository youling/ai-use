name: Audit 69 reusable inventory
on:
  workflow_call:
permissions:
  contents: read
jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inventory exact audited baseline
        run: python tools/audit_69.py
      - name: Read token positive and write negative probe
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/audit_69_token_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-69-${{ runner.os }}
          path: audit-output/*.json
          if-no-files-found: error
          retention-days: 7
