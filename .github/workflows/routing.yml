name: Routing and recovery structure
on:
  pull_request:
  push:
    branches: [main, 'codex/r74-*']
permissions:
  contents: read
concurrency:
  group: routing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  routing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Catalog, projections, links, public fixtures and event diff
        env:
          ROUTING_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/routing.py --check --check-whitespace
      - name: Structural regressions
        run: python tools/test_routing.py
