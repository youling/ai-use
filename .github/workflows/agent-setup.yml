name: Agent setup Windows V1 and Linux contracts
on:
  pull_request:
    paths: ['agent-runtime/setup/**', '.github/workflows/agent-setup.yml']
  push:
    branches: [main]
    paths: ['agent-runtime/setup/**', '.github/workflows/agent-setup.yml']
permissions:
  contents: read
concurrency:
  group: agent-setup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Isolated pinned test environment
        run: python -m pip install --isolated --no-cache-dir --require-hashes -r agent-runtime/setup/requirements-test.lock
      - name: Engine, metadata adapter and headless Textual fixtures
        env:
          PYTHONPATH: agent-runtime/setup
        run: python -m pytest agent-runtime/setup/tests -q
      - name: Windows thin bootstrap metadata only
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./agent-runtime/setup/bootstrap.ps1 -CheckOnly
