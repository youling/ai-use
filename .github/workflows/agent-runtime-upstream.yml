name: Agent runtime upstream observation
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record upstream observation without promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/anomalyco/opencode/releases/latest --jq '{tag: .tag_name, url: .html_url, published_at: .published_at}' > upstream-observation.json
          python -c 'import json; p="upstream-observation.json"; d=json.load(open(p)); d.update(pinned="v2.0.22", classification="MATCH" if d["tag"]=="v2.0.22" else "PROPOSAL_REQUIRED", authority_effect="NONE"); open(p,"w").write(json.dumps(d,indent=2)+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upstream-observation
          path: upstream-observation.json
